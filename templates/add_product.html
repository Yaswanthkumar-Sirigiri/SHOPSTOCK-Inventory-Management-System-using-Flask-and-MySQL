{% extends "base.html" %}
{% block title %}{{ 'Edit Product' if editing else 'Add Product' }}{% endblock %}
{% block content %}
<div class="box">
  <h2 class="h6 fw-bold mb-4">Enter product details</h2>

  <form method="post">
    <div class="row g-4">
      <div class="col-md-6">
        <label class="form-label fw-bold small">Product Name</label>
        <input class="form-control" name="name" maxlength="100" required
               placeholder="e.g. Wireless Mouse" value="{{ product.get('name', '') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small">Category</label>
        <input class="form-control" name="category" maxlength="50"
               placeholder="e.g. Electronics" value="{{ product.get('category') or '' }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small">Quantity</label>
        <input class="form-control" type="number" name="quantity" min="0" step="1" required
               placeholder="e.g. 25" value="{{ product.get('quantity', '') }}">
      </div>
      <div class="col-md-6">
        <label class="form-label fw-bold small">Price (₹)</label>
        <input class="form-control" type="number" name="price" min="0" step="0.01" required
               placeholder="e.g. 499.00" value="{{ product.get('price', '') }}">
      </div>
    </div>

    <p class="small text-muted mt-4">
      Validation: quantity must be 0 or more; price cannot be negative.
    </p>

    <button class="btn btn-primary">Save Product</button>
    <a class="btn btn-light border" href="{{ url_for('products') }}">Cancel</a>
  </form>
</div>
{% endblock %}
